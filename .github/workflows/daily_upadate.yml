name: Daily Update

on:
  schedule:
    - cron: '30 1 * * *'  # 这代表北京时间 09:30
  workflow_dispatch: # 允许我们手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 检查代码
      uses: actions/checkout@v3

    - name: 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 安装必要的工具
      run: pip install requests beautifulsoup4

    - name: 运行抓取脚本
      run: python scraper.py

    - name: 提交并推送数据更新
      run: |
        git config --global user.name "Automated Scraper"
        git config --global user.email "actions@github.com"
        git add data.json
        git commit -m "自动更新招标数据: $(date)" || exit 0
        git push
